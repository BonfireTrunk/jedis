name: build

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    uses: BonfireTrunk/.github/.github/workflows/maven-build.yml@prime
    with:
      # Integration tests need a Redis server, which the runner does not have
      maven-args: verify -DskipIntegrationTests=true
